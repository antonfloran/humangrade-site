<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Human Grade — закрытый просмотр</title>
<style>
  :root{ color-scheme: light; --bg:#FAF9F7; --ink:#38647D; --mute:rgba(56,100,125,.62); --line:rgba(56,100,125,.2); --accent:#E68649; --err:#B3123C; }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
    background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card{ width:100%; max-width:380px; }
  .mark{ font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:28px; }
  h1{ margin:0 0 10px; font-size:24px; font-weight:650; letter-spacing:-.01em; }
  p{ margin:0 0 26px; color:var(--mute); font-size:14.5px; }
  label{ display:block; font-size:13px; color:var(--mute); margin-bottom:8px; }
  input{ width:100%; padding:14px 16px; min-height:50px; border:1px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink); font:500 17px/1.2 inherit; }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(230,134,73,.30); }
  button{ width:100%; margin-top:12px; padding:14px 20px; min-height:50px; border:0; border-radius:10px;
    cursor:pointer; background:var(--ink); color:var(--bg); font:600 15px/1 inherit; }
  button:disabled{ opacity:.5; cursor:default; }
  .err{ margin-top:14px; font-size:13.5px; color:var(--err); min-height:20px; }
  .hint{ margin-top:22px; font-size:12.5px; color:rgba(56,100,125,.45); line-height:1.5; }
</style>

<div class="card">
  <div class="mark">Human Grade</div>
  <h1>Закрытый просмотр</h1>
  <p>Прототип личного кабинета на согласовании. Введите пароль, чтобы открыть.</p>
  <form id="f">
    <label for="p">Пароль</label>
    <input id="p" type="password" autocomplete="current-password" autofocus aria-describedby="e">
    <button type="submit" id="b">Открыть</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <p class="hint">Содержимое зашифровано: без пароля страница не читается даже из исходного кода.
    Пароль спрашивается один раз — дальше кабинет открывается сам.</p>
</div>

  function decrypt(raw){   /* raw — сырой ключ AES, общий для всех страниц кабинета */
    return crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt'])
