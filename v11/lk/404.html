<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Human Grade | закрытый просмотр</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:slnt,wght,CRSV,SHRP@0,600,1,0&family=Onest:wght@400;500;600&family=Sofia+Sans+Condensed:wght@700&display=swap">
<style>
  :root{ color-scheme: light; --bg:#FBF9F2; --ink:#2E2622; --mute:#6A5D55; --line:#D6C9B2; --terra:#984830; --action:#C1483A; --action-h:#A83C30; --err:#A8303A; }
  *,*::before,*::after{ box-sizing:border-box; }
  body{ margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px;
    background:var(--bg); color:var(--ink); font:16px/1.6 Onest,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .card{ width:100%; max-width:400px; background:#fff; border-radius:28px; padding:36px 32px 30px;
    box-shadow:0 1px 2px rgba(46,38,34,.05), 0 30px 60px -30px rgba(46,38,34,.45); }
  .mark{ font:700 14px/1 "Sofia Sans Condensed","Arial Narrow",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--terra); margin-bottom:26px; }
  h1{ margin:0 0 10px; font:600 30px/1.05 Geologica,Onest,sans-serif; font-variation-settings:'CRSV' 1; letter-spacing:-.03em; }
  p{ margin:0 0 24px; color:var(--mute); font-size:15px; }
  label{ display:block; font:700 13px/1 "Sofia Sans Condensed","Arial Narrow",sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); margin-bottom:10px; }
  input{ width:100%; padding:14px 18px; min-height:54px; border:1.5px solid var(--line); border-radius:14px;
    background:#fff; color:var(--ink); font:500 17px/1.2 Onest,sans-serif; caret-color:var(--action); }
  input:focus{ outline:none; border-color:#BE6341; box-shadow:0 0 0 4px rgba(190,99,65,.16); }
  button{ width:100%; margin-top:14px; padding:14px 20px; min-height:54px; border:0; border-radius:999px;
    cursor:pointer; background:var(--action); color:#fff; font:600 16px/1 Onest,sans-serif; box-shadow:0 14px 28px -16px rgba(193,72,58,.9); transition:background .2s; }
  button:hover{ background:var(--action-h); }
  button:disabled{ opacity:.5; cursor:default; }
  button:focus-visible{ outline:2.5px solid #276E82; outline-offset:3px; }
  .err{ margin-top:14px; font-size:14px; color:var(--err); min-height:20px; }
  .hint{ margin:18px 0 0; font-size:13px; color:#8C7F76; line-height:1.5; }
</style>

<div class="card">
  <h1>Закрытый просмотр</h1>
  <p>Новая версия сайта Human Grade на согласовании. Введите пароль, чтобы открыть.</p>
  <form id="f">
    <label for="p">Пароль</label>
    <input id="p" type="password" autocomplete="current-password" autofocus aria-describedby="e">
    <button type="submit" id="b">Открыть</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <p class="hint">Содержимое зашифровано: без пароля страница не читается даже из исходного кода.
    Пароль спрашивается один раз, дальше страницы открываются сами.</p>
</div>

  function decrypt(raw){   /* raw — сырой ключ AES, общий для всех страниц кабинета */
    return crypto.subtle.importKey('raw', raw, { name:'AES-GCM' }, false, ['decrypt'])
      .then(function(key){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(IV) }, key, bytes(DATA)); })
      .then(function(plain){ show(new TextDecoder().decode(plain)); });
  }
  function derive(value){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(value), 'PBKDF2', false, ['deriveBits'])
      .then(function(base){ return crypto.subtle.deriveBits(

  }

    var open = function () {
      decrypt(bytes(saved)).catch(function () {
        try { sessionStorage.removeItem(KEYSTORE); } catch (e) {}

    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', open);

  }

      err.textContent = 'Браузер не поддерживает расшифровку. Откройте страницу по https в современном браузере.';

    }).catch(fail);
  });
